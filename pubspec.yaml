name: quincaillerie_stock
description: Gestion de stock pour quincaillerie
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0

  # State management
  provider: ^6.1.2

  # HTTP client
  dio: ^5.4.3

  # Navigation
  go_router: ^14.0.0

  # Stockage local (token, prefs)
  shared_preferences: ^2.2.3
  pdf: 3.11.1
  printing: 5.13.1
  path_provider: 2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true